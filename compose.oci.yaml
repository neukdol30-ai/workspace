services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    image: workspace-api:oci
    container_name: workspace-oci-api
    restart: unless-stopped

    env_file:
      - .env.oci

    volumes:
      - ./secrets/oracle-wallet:/opt/oracle/wallet:ro

    expose:
      - "8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    image: workspace-frontend:oci
    container_name: workspace-oci-frontend
    restart: unless-stopped

    depends_on:
      api:
        condition: service_healthy

    ports:
      - "${WORKSPACE_HTTP_PORT:-8081}:80"