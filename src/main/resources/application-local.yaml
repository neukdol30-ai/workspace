spring:
  datasource:
    url: jdbc:oracle:thin:@//localhost:1521/FREEPDB1
    username: workspace_app
    password: ${WORKSPACE_DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

  flyway:
    enabled: true
    locations:
    - classpath:db/migration
    - classpath:db/local
    baseline-on-migrate: false
    clean-disabled: true