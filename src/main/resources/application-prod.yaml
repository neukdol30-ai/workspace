spring:
  datasource:
    url: ${WORKSPACE_DB_URL}
    username: ${WORKSPACE_DB_USERNAME}
    password: ${WORKSPACE_DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

    hikari:
      maximum-pool-size: ${WORKSPACE_DB_MAX_POOL_SIZE:5}
      minimum-idle: 1

  flyway:
    enabled: true
    locations:
      - classpath:db/migration
    baseline-on-migrate: false
    clean-disabled: true

management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: never